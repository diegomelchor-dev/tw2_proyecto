{% extends "base.html" %}
{% block titulo %} Carrusel {% endblock %}

{% block contenido %}

    <h2>Carrusel de Img</h2>
    <div class="carousel">
        <div class="slides" id="slides">
            <div class="slide active"><img src="{{ url_for('static', filename='img/carrusel/imagen01.jpg') }}" alt="Imagen 1" ></div>
            <div class="slide"><img src="{{ url_for('static', filename='img/carrusel/imagen02.jpg') }}" alt="Imagen 2" ></div>
            <div class="slide"><img src="{{ url_for('static', filename='img/carrusel/imagen03.jpg') }}" alt="Imagen 3" ></div>
            <div class="slide"><img src="{{ url_for('static', filename='img/carrusel/imagen04.jpg') }}" alt="Imagen 4" ></div>
            <div class="slide"><img src="{{ url_for('static', filename='img/carrusel/imagen05.jpg') }}" alt="Imagen 5" ></div>
            <div class="slide"><img src="{{ url_for('static', filename='img/carrusel/imagen06.jpg') }}" alt="Imagen 6" ></div>
            <div class="slide"><img src="{{ url_for('static', filename='img/carrusel/imagen07.jpg') }}" alt="Imagen 7" ></div>
            <div class="slide"><img src="{{ url_for('static', filename='img/carrusel/imagen08.jpg') }}" alt="Imagen 8" ></div>
        </div>

        <button class="btn prev" onclick="mover(-1)">&#10094; </button>
        <button class="btn next" onclick="mover(1)">&#10095; </button>

        <div class="dots" id="dots"></div>
    </div>

{% endblock %}

{% block css %} 
    <link rel="stylesheet" href="{{ url_for('static', filename='css/carrusel/carrusel.css') }}">
{% endblock %}

{% block js %} 
    <script src="{{ url_for('static', filename='js/carrusel/carrusel.js') }}"></script>
{% endblock %}
